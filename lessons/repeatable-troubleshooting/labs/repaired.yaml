receivers:
  otlp:
    protocols:
      http:
        endpoint: "127.0.0.1:@HTTP@"
exporters:
  otlp_http:
    endpoint: "http://127.0.0.1:@TARGET@"
    timeout: 1s
    sending_queue:
      enabled: false
    retry_on_failure:
      enabled: false
service:
  telemetry:
    logs:
      level: info
      encoding: json
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 127.0.0.1
                port: "@METRICS@"
                without_type_suffix: true
                without_units: true
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [otlp_http]
