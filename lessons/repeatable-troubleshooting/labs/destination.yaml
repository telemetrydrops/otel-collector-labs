receivers:
  otlp:
    protocols:
      http:
        endpoint: "127.0.0.1:@HTTP@"
exporters:
  file:
    path: "@OUTPUT@/destination.jsonl"
    flush_interval: 100ms
service:
  telemetry:
    logs:
      level: info
      encoding: json
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 127.0.0.1
                port: "@METRICS@"
                without_type_suffix: true
                without_units: true
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [file]
