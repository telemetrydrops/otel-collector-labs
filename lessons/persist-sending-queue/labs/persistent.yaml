extensions:
  file_storage:
    directory: ${env:LESSON_STORAGE}
    fsync: true
    create_directory: false
receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:${env:LESSON_PORT}
exporters:
  otlp_http:
    endpoint: http://127.0.0.1:${env:LESSON_DESTINATION}
    encoding: json
    timeout: 500ms
    retry_on_failure:
      enabled: true
      initial_interval: 100ms
      max_interval: 100ms
      randomization_factor: 0
      max_elapsed_time: 0s
    sending_queue:
      enabled: true
      storage: file_storage
      sizer: requests
      queue_size: 10
      num_consumers: 1
      block_on_overflow: false
service:
  extensions: [file_storage]
  telemetry:
    metrics:
      level: none
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [otlp_http]
