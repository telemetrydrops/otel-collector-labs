      {
        "apiVersion": "opentelemetry.io/v1beta1",
        "kind": "OpenTelemetryCollector",
        "metadata": { "name": "scrapers", "namespace": "@NAMESPACE@" },
        "spec":
          {
            "mode": "statefulset",
            "replicas": 2,
            "image": "otel/opentelemetry-collector-contrib:0.163.1",
            "resources":
              {
                "requests": { "cpu": "25m", "memory": "64Mi" },
                "limits": { "cpu": "200m", "memory": "128Mi" },
              },
            "targetAllocator":
              {
                "enabled": true,
                "image": "ghcr.io/open-telemetry/opentelemetry-operator/target-allocator:0.161.0",
                "allocationStrategy": "least-weighted",
                "collectorNotReadyGracePeriod": "1s",
                "collectorTargetReloadInterval": "2s",
                "serviceAccount": "allocator-reader",
                "prometheusCR": { "enabled": false },
                "resources":
                  {
                    "requests": { "cpu": "10m", "memory": "64Mi" },
                    "limits": { "cpu": "100m", "memory": "128Mi" },
                  },
              },
            "config":
              {
                "receivers":
                  {
                    "prometheus":
                      {
                        "config":
                          {
                            "scrape_configs":
                              [
                                {
                                  "job_name": "fixture",
                                  "scrape_interval": "1s",
                                  "scrape_timeout": "500ms",
                                  "static_configs":
                                    [
                                      {
                                        "targets":
                                          [
                                            "fixture-a:9090",
                                            "fixture-b:9090",
                                            "fixture-c:9090",
                                            "fixture-d:9090",
                                          ],
                                      },
                                    ],
                                },
                              ],
                          },
                      },
                  },
                "exporters":
                  {
                    "file":
                      { "path": "/dev/stdout", "flush_interval": "100ms" },
                  },
                "service":
                  {
                    "telemetry": { "metrics": { "level": "none" } },
                    "pipelines":
                      {
                        "metrics":
                          {
                            "receivers": ["prometheus"],
                            "exporters": ["file"],
                          },
                      },
                  },
              },
