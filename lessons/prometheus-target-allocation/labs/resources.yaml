        "apiVersion": "v1",
        "kind": "ConfigMap",
        "metadata": { "name": "fixture-a", "namespace": "@NAMESPACE@" },
        "data":
          {
            "metrics": "# TYPE lesson_queue_depth gauge\nlesson_queue_depth{source=\"a\"} 7\n",
          },
      },
      {
        "apiVersion": "apps/v1",
        "kind": "Deployment",
        "metadata": { "name": "fixture-a", "namespace": "@NAMESPACE@" },
        "spec":
          {
            "replicas": 1,
            "selector": { "matchLabels": { "app": "fixture-a" } },
            "template":
              {
                "metadata": { "labels": { "app": "fixture-a" } },
                "spec":
                  {
                    "containers":
                      [
                        {
                          "name": "target",
                          "image": "busybox@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e",
                          "command":
                            ["httpd", "-f", "-p", "9090", "-h", "/www"],
                          "resources":
                            {
                              "requests": { "cpu": "5m", "memory": "8Mi" },
                              "limits": { "cpu": "50m", "memory": "16Mi" },
                            },
                          "volumeMounts":
                            [
                              {
                                "name": "content",
                                "mountPath": "/www",
                                "readOnly": true,
                              },
                            ],
                        },
                      ],
                    "volumes":
                      [
                        {
                          "name": "content",
                          "configMap": { "name": "fixture-a" },
                        },
                      ],
                  },
              },
          },
      },
      {
        "apiVersion": "v1",
        "kind": "Service",
        "metadata": { "name": "fixture-a", "namespace": "@NAMESPACE@" },
        "spec":
          {
            "selector": { "app": "fixture-a" },
            "ports": [{ "port": 9090, "targetPort": 9090 }],
          },
      },
