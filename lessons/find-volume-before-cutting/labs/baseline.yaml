receivers:
  otlp:
    protocols:
      http:
        endpoint: "127.0.0.1:@PORT@"
exporters:
  file:
    path: "@OUTPUT@/output.jsonl"
    flush_interval: 100ms
service:
  telemetry:
    metrics:
      level: none
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [file]
    metrics:
      receivers: [otlp]
      exporters: [file]
    logs:
      receivers: [otlp]
      exporters: [file]
