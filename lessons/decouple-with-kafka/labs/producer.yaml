receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:${env:LESSON_PORT}
exporters:
  kafka:
    brokers: ["127.0.0.1:${env:KAFKA_PORT}"]
    traces:
      topic: lesson-traces
      encoding: otlp_proto
    producer:
      required_acks: -1
      allow_auto_topic_creation: false
    sending_queue:
      enabled: false
    retry_on_failure:
      enabled: false
service:
  telemetry:
    metrics:
      level: none
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [kafka]
