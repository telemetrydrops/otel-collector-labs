receivers:
  otlp:
    protocols:
      http:
        endpoint: ${env:LESSON_OTLP_ENDPOINT}
exporters:
  file:
    path: ${env:LESSON_TRACE_FILE}
    flush_interval: 100ms
processors:
  transform:
    error_mode: propagate
    trace_statements:
      - context: span
        statements:
          - set(span.attributes["lesson.order"], "first")
          - set(span.attributes["lesson.order"], "second") where span.attributes["lesson.order"] == "first"
          - set(span.attributes["lesson.parsed"], Int(span.attributes["lesson.quantity"]))
          - set(span.attributes["lesson.after"], true)
service:
  telemetry:
    metrics:
      level: none
  pipelines:
    traces:
      receivers: [otlp]
      processors: [transform]
      exporters: [file]
