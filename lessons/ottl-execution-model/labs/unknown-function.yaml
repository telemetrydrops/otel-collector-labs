receivers:
  otlp:
    protocols:
      http:
        endpoint: ${env:LESSON_OTLP_ENDPOINT}
exporters:
  file:
    path: ${env:LESSON_TRACE_FILE}
    flush_interval: 100ms
processors:
  transform:
    error_mode: ignore
    trace_statements:
      - set(span.attributes["lesson.flag"], InventedConverter(span.name))
service:
  telemetry:
    metrics:
      level: none
  pipelines:
    traces:
      receivers: [otlp]
      processors: [transform]
      exporters: [file]
