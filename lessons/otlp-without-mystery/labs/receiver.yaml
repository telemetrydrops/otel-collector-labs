receivers:
  otlp:
    protocols:
      http:
        endpoint: "127.0.0.1:@HTTP@"
      grpc:
        endpoint: "127.0.0.1:@GRPC@"
exporters:
  file:
    path: "@OUTPUT@/destination.jsonl"
service:
  telemetry:
    metrics:
      level: none
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [file]
