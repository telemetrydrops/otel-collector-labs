receivers:
  otlp:
    protocols:
      http:
        endpoint: "127.0.0.1:@HTTP@"
exporters:
  otlp_http:
    endpoint: "http://127.0.0.1:@TARGET@"
    timeout: 1s
    sending_queue:
      queue_size: 2
      num_consumers: 1
    retry_on_failure:
      initial_interval: 100ms
      max_interval: 100ms
      max_elapsed_time: 1s
extensions:
  health_check:
    endpoint: "127.0.0.1:@HEALTH@"
service:
  extensions: [health_check]
  telemetry:
    logs:
      level: info
      encoding: json
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 127.0.0.1
                port: "@METRICS@"
                without_type_suffix: true
                without_units: true
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [otlp_http]
