receivers:
  otlp:
    protocols:
      http:
        endpoint: ${env:LESSON_OTLP_ENDPOINT}
exporters:
  file:
    path: ${env:LESSON_TRACE_FILE}
    flush_interval: 100ms
processors:
  transform:
    error_mode: ignore
    trace_statements:
      - context: resource
        statements:
          - set(resource.attributes["checkout.stage"], resource.attributes["checkout.stage_legacy"]) where resource.attributes["checkout.stage_legacy"] != nil
          - delete_key(resource.attributes, "checkout.stage_legacy")
service:
  telemetry:
    metrics:
      level: none
  pipelines:
    traces:
      receivers: [otlp]
      processors: [transform]
      exporters: [file]
