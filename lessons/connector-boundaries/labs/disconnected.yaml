connectors:
  count:
receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:${env:LESSON_PORT}
exporters:
  file/traces:
    path: ${env:LESSON_WORK}/traces.jsonl
  file/metrics:
    path: ${env:LESSON_WORK}/metrics.jsonl
service:
  telemetry:
    metrics:
      level: none
  pipelines:
    traces/in:
      receivers: [otlp]
      exporters: [file/traces, count]
