connectors:
  count/incoming:
    spans:
      lesson.spans.incoming:
  count/kept:
    spans:
      lesson.spans.kept:
  forward/to-sampler:
processors:
  probabilistic_sampler:
    sampling_percentage: 100
receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:${env:LESSON_PORT}
exporters:
  file/traces:
    path: ${env:LESSON_WORK}/traces.jsonl
  file/metrics:
    path: ${env:LESSON_WORK}/metrics.jsonl
  file/input:
    path: ${env:LESSON_WORK}/input.jsonl
service:
  telemetry:
    metrics:
      level: none
  pipelines:
    traces/in:
      receivers: [otlp]
      exporters: [file/input, count/incoming, forward/to-sampler]
    traces/kept:
      receivers: [forward/to-sampler]
      processors: [probabilistic_sampler]
      exporters: [file/traces, count/kept]
    metrics/before:
      receivers: [count/incoming]
      exporters: [file/metrics]
    metrics/after:
      receivers: [count/kept]
      exporters: [file/metrics]
