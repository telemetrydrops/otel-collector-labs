{
  "receivers":
    { "otlp": { "protocols": { "http": { "endpoint": "127.0.0.1:@HTTP@" } } } },
  "exporters":
    {
      "otlp_http":
        {
          "endpoint": "http://127.0.0.1:@TARGET@",
          "encoding": "json",
          "timeout": "3s",
          "sending_queue": { "enabled": false },
          "retry_on_failure": { "enabled": false },
        },
    },
  "service":
    {
      "telemetry": { "metrics": { "level": "none" } },
      "pipelines":
        { "traces": { "receivers": ["otlp"], "exporters": ["otlp_http"] } },
    },
}
