receivers:
  otlp:
    protocols:
      http:
        endpoint: "127.0.0.1:@HTTP@"
exporters:
  file:
    path: "@OUTPUT@/output.jsonl"
    flush_interval: 100ms
service:
  telemetry:
    logs:
      level: info
      encoding: json
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 127.0.0.1
                port: "@METRICS@"
                without_type_suffix: true
                without_units: true
    traces:
      processors:
        - batch:
            exporter:
              otlp:
                protocol: http/protobuf
                endpoint: "http://127.0.0.1:@OBSERVER@"
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [file]
