processors:
  transform:
    error_mode: propagate
    trace_statements:
      - set(resource.attributes["lesson.distribution"], "contrib")
receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:${env:LESSON_PORT}
exporters:
  file:
    path: ${env:LESSON_OUTPUT}
service:
  telemetry:
    metrics:
      level: none
  pipelines:
    traces:
      receivers: [otlp]
      processors: [transform]
      exporters: [file]
