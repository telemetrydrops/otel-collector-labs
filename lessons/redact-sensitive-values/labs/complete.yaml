receivers:
  otlp:
    protocols:
      http:
        endpoint: ${env:LESSON_OTLP_ENDPOINT}
exporters:
  file:
    path: ${env:LESSON_TRACE_FILE}
    flush_interval: 100ms
processors:
  transform:
    error_mode: ignore
    trace_statements:
      - delete_key(resource.attributes, "synthetic.customer.email")
      - delete_key(span.attributes, "synthetic.token")
    log_statements:
      - delete_key(resource.attributes, "synthetic.customer.email")
      - delete_key(log.attributes, "synthetic.token")
      - replace_pattern(log.body, "token=[^ ]+", "token=[REDACTED]") where IsString(log.body)
service:
  telemetry:
    metrics:
      level: none
  pipelines:
    traces:
      receivers: [otlp]
      processors: [transform]
      exporters: [file]
    logs:
      receivers: [otlp]
      processors: [transform]
      exporters: [file]
